<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humanitarian Map Style</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
  <style>
    html, body, #map { margin: 0; height: 100%; }
    body { font: 14px/1.4 system-ui, sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      max-width: calc(100% - 80px); padding: 8px 12px;
      background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    #info h1 { margin: 0 0 4px; font-size: 16px; }
    #info code { word-break: break-all; }
  </style>
</head>
<body>
  <div id="info">
    <h1>Humanitarian Map Style</h1>
    Use in MapLibre: <code id="style-url"></code>
  </div>
  <div id="map"></div>
  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

    const styleUrl = new URL('style.json', location.href).href;
    document.getElementById('style-url').textContent = styleUrl;

    const map = new maplibregl.Map({
      container: 'map',
      style: styleUrl,
      center: [85.324, 27.7172],
      zoom: 14,
      hash: true,
    });
    map.addControl(new maplibregl.NavigationControl());
    map.addControl(new maplibregl.ScaleControl());
  </script>
</body>
</html>
